<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduMaster">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>EduMaster | Cổng Đăng Nhập Tập Trung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Be Vietnam Pro', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5); }
        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px); }
        .modal-enter { animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen">
    
    <!-- Background Vô Cực -->
    <div class="absolute inset-0 bg-grid pointer-events-none"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div id="toast-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-4xl p-6">
        <!-- Logo & Slogan -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white text-3xl font-black shadow-lg shadow-blue-500/30 mb-4">⚡</div>
            <h1 class="text-3xl md:text-4xl font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">EduMaster 2025</h1>
            <p class="text-slate-400 mt-2 font-medium tracking-wide">HỆ SINH THÁI KHẢO THÍ & ĐÁNH GIÁ NĂNG LỰC TOÀN DIỆN</p>
        </div>

        <!-- Khối Phân Quyền Đăng Nhập -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto" id="role-selection">
            <!-- Dành cho Học Sinh -->
            <button onclick="Portal.showStudentLogin()" class="glass-card rounded-3xl p-8 text-left transition-all duration-300 group relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                <div class="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-3xl mb-6 border border-emerald-500/30">🎓</div>
                <h2 class="text-2xl font-black text-white mb-2 uppercase tracking-wide">Dành cho Học Sinh</h2>
                <p class="text-slate-400 text-sm leading-relaxed mb-6 font-medium">Truy cập Sảnh chờ Live Arena, tham gia ca thi, luyện tập tự do và tra cứu bảng điểm cá nhân.</p>
                <div class="flex items-center text-emerald-400 text-sm font-bold uppercase tracking-wider group-hover:gap-2 transition-all">Vào Sảnh Chờ <span class="ml-1 text-lg">→</span></div>
            </button>

            <!-- Dành cho Giáo Viên -->
            <button onclick="Portal.showAdminLogin()" class="glass-card rounded-3xl p-8 text-left transition-all duration-300 group relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                <div class="w-14 h-14 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center text-3xl mb-6 border border-blue-500/30">👨‍🏫</div>
                <h2 class="text-2xl font-black text-white mb-2 uppercase tracking-wide">Dành cho Giáo Viên</h2>
                <p class="text-slate-400 text-sm leading-relaxed mb-6 font-medium">Truy cập Trung tâm Quản trị, tạo đề thi, cấu hình ca thi, giám sát trực tuyến và chấm bài tự luận.</p>
                <div class="flex items-center text-blue-400 text-sm font-bold uppercase tracking-wider group-hover:gap-2 transition-all">Vào Quản Trị <span class="ml-1 text-lg">→</span></div>
            </button>
        </div>
    </div>

    <!-- MODAL 1: HỌC SINH -->
    <div id="modal-student" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 w-full max-w-md shadow-2xl relative">
            <button onclick="Portal.closeModals()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition">✕</button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-emerald-500/30">🎓</div>
                <h3 class="text-xl font-black text-white uppercase tracking-wider">Định danh Thí sinh</h3>
                <p class="text-xs text-slate-400 mt-2 font-medium">Hệ thống sẽ ghi nhận thông tin này vào bài làm.</p>
            </div>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Họ và Tên</label>
                    <!-- THAY ĐỔI: text-base -->
                    <input type="text" id="std-name" placeholder="Nguyễn Văn A" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3.5 outline-none focus:border-emerald-500 focus:bg-slate-800/50 transition placeholder-slate-600 font-bold text-base" onkeypress="if(event.key === 'Enter') document.getElementById('std-class').focus()">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Lớp</label>
                    <!-- THAY ĐỔI: text-base -->
                    <input type="text" id="std-class" placeholder="Ví dụ: 12A1" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3.5 outline-none focus:border-emerald-500 focus:bg-slate-800/50 transition placeholder-slate-600 font-bold uppercase text-base" onkeypress="if(event.key === 'Enter') Portal.enterArena()">
                </div>
            </div>
            <button onclick="Portal.enterArena()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl transition uppercase tracking-widest shadow-[0_0_20px_rgba(5,150,105,0.3)] active:scale-95">Mở Sảnh Chờ Arena</button>
        </div>
    </div>

    <!-- MODAL 2: QUẢN TRỊ -->
    <div id="modal-admin" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 w-full max-w-md shadow-2xl relative">
            <button onclick="Portal.closeModals()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition">✕</button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-blue-500/30">🔒</div>
                <h3 class="text-xl font-black text-white uppercase tracking-wider">Xác thực Quản trị</h3>
                <p class="text-xs text-slate-400 mt-2 font-medium">Chỉ dành cho Giáo viên / Hội đồng khảo thí.</p>
            </div>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Mật khẩu truy cập</label>
                    <!-- THAY ĐỔI: text-base -->
                    <input type="password" id="adm-pass" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3.5 outline-none focus:border-blue-500 focus:bg-slate-800/50 transition placeholder-slate-600 font-bold tracking-widest text-center text-base" onkeypress="if(event.key === 'Enter') Portal.enterAdmin()">
                </div>
            </div>
            <button onclick="Portal.enterAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition uppercase tracking-widest shadow-[0_0_20px_rgba(37,99,235,0.3)] active:scale-95">Đăng Nhập Hệ Thống</button>
        </div>
    </div>

    <!-- HỆ THỐNG LOGIC ĐIỀU HƯỚNG -->
    <script>
        const Utils = {
            toast: (msg, type = 'info') => {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                const col = type === 'error' ? 'bg-rose-500/90 border-rose-500' : 'bg-emerald-500/90 border-emerald-500';
                t.className = `flex items-center gap-2 ${col} text-white px-5 py-3.5 rounded-2xl shadow-2xl border text-sm font-bold backdrop-blur-sm transition-all transform opacity-100`;
                t.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${msg}</span>`;
                c.appendChild(t);
                t.animate([{ transform: 'translateY(-20px) scale(0.9)', opacity: 0 }, { transform: 'translateY(0) scale(1)', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
                setTimeout(() => { 
                    const a = t.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateX(20px)' }], { duration: 300, fill: 'forwards' }); 
                    a.onfinish = () => t.remove(); 
                }, 3000);
            }
        };

        const Portal = {
            init() {
                // Tiện ích: Tải sẵn tên/lớp nếu học sinh đã từng đăng nhập trước đó
                const lastUser = JSON.parse(localStorage.getItem('eduMasterLastUser'));
                if (lastUser && lastUser.name && lastUser.class) {
                    document.getElementById('std-name').value = lastUser.name;
                    document.getElementById('std-class').value = lastUser.class;
                }
            },

            showStudentLogin() {
                const m = document.getElementById('modal-student');
                m.classList.remove('hidden');
                m.classList.add('flex');
                setTimeout(() => {
                    m.classList.remove('opacity-0');
                    m.firstElementChild.classList.add('modal-enter');
                    document.getElementById('std-name').focus();
                }, 10);
            },

            showAdminLogin() {
                const m = document.getElementById('modal-admin');
                m.classList.remove('hidden');
                m.classList.add('flex');
                setTimeout(() => {
                    m.classList.remove('opacity-0');
                    m.firstElementChild.classList.add('modal-enter');
                    document.getElementById('adm-pass').focus();
                }, 10);
            },

            closeModals() {
                ['modal-student', 'modal-admin'].forEach(id => {
                    const m = document.getElementById(id);
                    m.classList.add('opacity-0');
                    m.firstElementChild.classList.remove('modal-enter');
                    setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300);
                });
            },

            enterArena() {
                const name = document.getElementById('std-name').value.trim();
                const cls = document.getElementById('std-class').value.trim().toUpperCase();
                
                if (!name || !cls) return Utils.toast("Vui lòng điền đủ Họ tên và Lớp!", "error");
                
                // Lưu cache để dùng cho file arena.html
                localStorage.setItem('eduMasterLastUser', JSON.stringify({ name: name, class: cls }));
                
                // Hiệu ứng mờ dần trước khi chuyển trang
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.4s ease';
                setTimeout(() => { window.location.href = 'arena.html'; }, 400);
            },

            enterAdmin() {
                const pass = document.getElementById('adm-pass').value.trim();
                
                // ============================================
                // MẬT KHẨU GIÁO VIÊN NẰM Ở ĐÂY:
                // ============================================
                if (pass === 'admin') { 
                    localStorage.setItem('eduMasterAdminAuth', 'true');
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => { window.location.href = 'admin.html'; }, 400);
                } else {
                    Utils.toast("Sai mật khẩu quản trị!", "error");
                    document.getElementById('adm-pass').value = '';
                }
            }
        };

        window.onload = Portal.init;
    </script>
    <script>
        // Đăng ký Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA sẵn sàng'))
                    .catch(err => console.error('Lỗi SW:', err));
            });
        }

        // Bắt sự kiện hiện thông báo cài đặt trên Android
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Tự động mở hộp thoại cài đặt sau 2 giây khi học sinh vào trang chủ
            setTimeout(() => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt = null;
                }
            }, 2000);
        });
    </script>
</body>
</html>
